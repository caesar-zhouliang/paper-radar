name: Deploy Paper Radar Pages

on:
  push:
    branches: [main]
    paths:
      - "data/history/**"
      - "data/readers/**"
      - "data/days.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: paper-radar-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 从已提交数据重建站点
        run: |
          DATE="$(python - <<'PY'
          import json
          from pathlib import Path
          days = json.loads(Path('data/days.json').read_text('utf-8'))
          print(days[0]['date'])
          PY
          )"
          python run.py --date "$DATE" --offline --no-notify

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
