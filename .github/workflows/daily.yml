name: Daily Paper Radar

on:
  schedule:
    - cron: "0 2 * * *"        # UTC 02:00 = 北京时间 10:00，作为本地 08:30 推送的兜底
  workflow_dispatch:           # 支持手动触发

permissions:
  contents: write

concurrency:
  group: paper-radar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取并生成站点
        env:
          # —— 翻译（可选）——
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          # —— 你的站点地址，用于 RSS 与推送里的链接 ——
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
          # —— 推送（可选）——
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: python run.py --no-notify

      - name: 提交数据（历史 + 翻译缓存）
        run: |
          git config user.name  "paper-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          if git diff --quiet --cached; then
            echo "数据无变化"
          else
            git commit -m "chore: data $(TZ=Asia/Shanghai date +%F)"
            git push
          fi
